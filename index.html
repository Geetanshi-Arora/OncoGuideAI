<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OncoGuide AI - Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="signup-container">
        <div class="left-section">
            <img src="img/signup.jpeg" alt="OncoGuide AI Medical Technology">
        </div>
        <div class="right-section">
            <div class="signup-card">
                <div class="logo-container">
                    <img src="img/logo.png" alt="OncoGuide AI Logo">
                </div>
                <h1>Create Your <span>Account</span></h1>
                <p class="subtitle"> Join OncoGuide AI and empower smarter cancer care.</p>
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <div class="input-box">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="name" name="name" placeholder="Enter your full name"required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-box">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" name="email"placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password"placeholder="Create a password" required>
                        <i class="fa-regular fa-eye"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirm-password" name="confirm-password"  placeholder="Confirm your password" required>
                        <i class="fa-regular fa-eye"></i>
                    </div>
                </div>
                <button type="button" class="signup-button">
                    Sign Up
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                <p class="login-text">
                    Already have an account?
                    <a href="login.html">
                        Login here
                    </a>
                </p>
            </div>
        </div>
    </div>
    <script src="signup.js"></script>
</body>
</html>
